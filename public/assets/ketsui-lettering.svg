<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 112" width="560" height="112" fill="none">
  <defs>
    <linearGradient id="jadeGold" x1="0" y1="0" x2="520" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="48%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#E5B869"/>
    </linearGradient>
    <linearGradient id="kinpakuLine" x1="0" y1="0" x2="560" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#E5B869" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-8%" y="-15%" width="116%" height="135%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#2DD4BF" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- 背面和风菱格底纹与舞台折扇几何线 -->
  <g opacity="0.32" stroke="url(#kinpakuLine)" stroke-width="1">
    <polygon points="26,54 44,36 62,54 44,72" fill="rgba(45,212,191,0.08)"/>
    <polygon points="32,54 44,42 56,54 44,66" stroke-dasharray="2 2"/>
    <path d="M62 54 H520"/>
    <path d="M88 88 C184 74, 302 98, 498 78" stroke="#E5B869" stroke-width="1.1" stroke-dasharray="4 6"/>
  </g>

  <!-- 左侧翡翠书签与流苏徽章 (カスタムベクター紋章) -->
  <g transform="translate(8, 14)" filter="url(#softGlow)">
    <path d="M22 4 L38 20 L22 68 L6 20 Z" fill="rgba(13,148,136,0.28)" stroke="url(#jadeGold)" stroke-width="1.6"/>
    <polygon points="22,13 30,21 22,29 14,21" fill="#2DD4BF"/>
    <circle cx="22" cy="42" r="2.6" fill="#E5B869"/>
    <path d="M22 68 C22 79, 16 84, 12 90 M22 68 C22 80, 22 86, 22 92 M22 68 C22 79, 28 84, 32 90" stroke="#E5B869" stroke-width="1.3" stroke-linecap="round"/>
  </g>

  <!-- 手绘感英文花体与书法笔触装饰弧线 -->
  <g transform="translate(56, 8)" filter="url(#softGlow)">
    <!-- 顶部微倾注记 -->
    <text x="4" y="16" fill="#E5B869" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="11" letter-spacing="4.2">
      KETSUI NO HIKARI · STAGE ATELIER FOLIO
    </text>

    <!-- 主展示艺术字造型 (带斜切笔势与雙重金翠描边) -->
    <g transform="rotate(-3.2 180 52)">
      <!-- 阴影衬底字 -->
      <text x="6" y="65" fill="rgba(229,184,105,0.22)" font-family="'Noto Serif JP', 'Yu Mincho', 'Songti SC', Georgia, serif" font-weight="700" font-style="italic" font-size="46" letter-spacing="2">
        決意の光 · 衣装手帖
      </text>
      <!-- 主字形 -->
      <text x="3" y="62" fill="url(#jadeGold)" font-family="'Noto Serif JP', 'Yu Mincho', 'Songti SC', Georgia, serif" font-weight="700" font-style="italic" font-size="46" letter-spacing="2">
        決意の光 · 衣装手帖
      </text>
    </g>

    <!-- 书法飞白尾翼与菱星点缀 -->
    <path d="M4 78 Q138 64 282 75 T476 64" stroke="url(#jadeGold)" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <path d="M48 84 Q190 74 358 82" stroke="#E5B869" stroke-width="0.9" opacity="0.7" fill="none"/>
    <polygon points="484,56 488,62 494,64 488,66 484,72 480,66 474,64 480,62" fill="#E5B869"/>
    <polygon points="452,22 455,26 459,28 455,30 452,34 449,30 445,28 449,26" fill="#2DD4BF"/>
  </g>
</svg>
